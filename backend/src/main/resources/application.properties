spring.application.name=weather app

# Database (values come from environment variables, see .env)
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# No automatic schema changes by default; the "local" profile (application-local.properties) enables them.
spring.jpa.hibernate.ddl-auto=none

# Redis (only takes effect once spring-boot-starter-data-redis is on the classpath)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# JWT (HS256). The signing secret comes from the JWT_SECRET environment variable (at least 32 characters).
security.jwt.secret=${JWT_SECRET}
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=14d

# Attributes of the JWT and CSRF cookies. Set secure=false only for local development over plain HTTP.
# SameSite=None (frontend on another site) requires secure=true.
security.cookie.secure=true
security.cookie.same-site=Lax

# CORS: the frontend origin comes from the WEBSITE_URL environment variable (see .env).
# Wildcards are rejected because credentials (cookies) are allowed.
security.cors.allowed-origins=${WEBSITE_URL}



# Login attempt protection
security.login-attempt.max-failed-attempts=6
# Failed attempt counter expires this long after the last failed attempt
security.login-attempt.failed-attempts-ttl=15m
# Block duration grows: initial * multiplier^(blocks - 1), capped at max (5m -> 10m -> 20m -> 40m -> 60m)
security.login-attempt.initial-block-duration=5m
security.login-attempt.block-duration-multiplier=2
security.login-attempt.max-block-duration=60m
# How long block history is remembered after the last block before escalation resets
security.login-attempt.block-history-ttl=24h
security.login-attempt.failed-attempts-key-prefix=login:attempts:
security.login-attempt.block-key-prefix=login:block:
security.login-attempt.block-history-key-prefix=login:block-history:

# Weather (OpenWeather free plan: Current Weather, 5 day / 3 hour Forecast, Geocoding; 60 calls/minute).
# The API key comes from the OPEN_WEATHER_API environment variable (see .env) and never leaves the server.
weather.api-key=${OPEN_WEATHER_API}
weather.open-weather-base-url=https://api.openweathermap.org
# Prefix autocomplete (Open-Meteo Geocoding API, no key). OpenWeather geocoding only matches whole names.
weather.autocomplete-base-url=https://geocoding-api.open-meteo.com
weather.units=metric
weather.connect-timeout=3s
weather.read-timeout=5s
# Weather data itself expires at the next full local hour; these caches hold rarely changing place data.
weather.autocomplete-ttl=24h
weather.geocoding-ttl=7d

# Weather session cookie: identifies the visitor's personal weather cache only, never used for authentication.
# Secure and SameSite come from security.cookie.*.
weather.session.cookie-name=weather_session
weather.session.max-age=30d

#limit of how much user can save favorite locations
favorite.location.max=10